[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-intelligence"
version = "0.2.0"
description = "Evidence-backed recruitment analytics over read-only Airtable data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recruitment-intelligence = "recruitment_intelligence.pipeline:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
